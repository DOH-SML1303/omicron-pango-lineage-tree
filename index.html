const width = 1400;
const height = 900;
const duration = 250;
const margin = {top: 30, right: 220, bottom: 30, left: 90};
const dx = 26;
const dy = 190;

const root = d3.hierarchy(treeData);
root.x0 = 0;
root.y0 = 0;

function collapse(node) {
  if (node.children) {
    node._children = node.children;
    node._children.forEach(collapse);
    node.children = null;
  }
}

function resetTree() {
  if (root._children && !root.children) {
    root.children = root._children;
    root._children = null;
  }
  if (root.children) root.children.forEach(collapse);
}

resetTree();

const treeLayout = d3.tree().nodeSize([dx, dy]);
const svg = d3.select("#tree").append("svg")
  .attr("width", width)
  .attr("height", height)
  .attr("viewBox", [-margin.left, -margin.top, width, height])
  .style("font", "12px sans-serif")
  .style("user-select", "none");

const zoomLayer = svg.append("g");
const linkLayer = zoomLayer.append("g");
const nodeLayer = zoomLayer.append("g");
svg.call(d3.zoom().scaleExtent([0.2, 4]).on("zoom", event => zoomLayer.attr("transform", event.transform)));

const tooltip = d3.select("#tooltip");
let nodeId = 0;

function update(source) {
  treeLayout(root);
  const nodes = root.descendants();
  const links = root.links();

  let left = root;
  let right = root;
  root.eachBefore(node => {
    if (node.x < left.x) left = node;
    if (node.x > right.x) right = node;
  });

  const neededHeight = Math.max(height, right.x - left.x + margin.top + margin.bottom + 80);
  svg.attr("height", neededHeight)
    .attr("viewBox", [-margin.left, left.x - margin.top - 40, width, neededHeight]);

  const node = nodeLayer.selectAll("g.node").data(nodes, d => d.id || (d.id = ++nodeId));

  const nodeEnter = node.enter().append("g")
    .attr("class", d => d.data.recombinant_segments ? "node recombinant" : "node")
    .attr("transform", `translate(${source.y0},${source.x0})`)
    .on("click", (event, d) => {
      if (d.children) {
        d._children = d.children;
        d.children = null;
      } else {
        d.children = d._children;
        d._children = null;
      }
      update(d);
    })
    .on("mousemove", (event, d) => {
      tooltip.style("opacity", 1)
        .style("left", `${event.clientX + 14}px`)
        .style("top", `${event.clientY + 14}px`)
        .text([d.data.name, `Expanded: ${d.data.expanded || "Unavailable"}`,
          ...(d.data.recombinant_segments ? [
            `Parent segments: ${d.data.recombinant_segments.join(" → ")}`,
            `Displayed under: ${d.data.display_parent}`] : [])].join("\n"));
    })
    .on("mouseleave", () => tooltip.style("opacity", 0));

  nodeEnter.append("circle").attr("r", 5).attr("fill", d => d._children ? "white" : "#4b5563");
  nodeEnter.append("text")
    .attr("dy", "0.32em")
    .attr("x", d => d._children ? -10 : 10)
    .attr("text-anchor", d => d._children ? "end" : "start")
    .text(d => d.data.name);

  const nodeMerge = nodeEnter.merge(node);
  nodeMerge.transition().duration(duration).attr("transform", d => `translate(${d.y},${d.x})`);
  nodeMerge.select("circle").attr("fill", d => d._children ? "white" : "#4b5563");
  nodeMerge.select("text").attr("x", d => d._children ? -10 : 10).attr("text-anchor", d => d._children ? "end" : "start");

  node.exit().transition().duration(duration).attr("transform", `translate(${source.y},${source.x})`).remove();

  const diagonal = d3.linkHorizontal().x(d => d.y).y(d => d.x);
  const link = linkLayer.selectAll("path.link").data(links, d => d.target.id);

  link.enter().append("path")
    .attr("class", d => d.target.data.recombinant_segments ? "link recombinant" : "link")
    .attr("d", () => {
      const o = {x: source.x0, y: source.y0};
      return diagonal({source: o, target: o});
    })
    .merge(link)
    .transition().duration(duration)
    .attr("d", diagonal);

  link.exit().transition().duration(duration)
    .attr("d", () => {
      const o = {x: source.x, y: source.y};
      return diagonal({source: o, target: o});
    })
    .remove();

  root.eachBefore(d => {
    d.x0 = d.x;
    d.y0 = d.y;
  });
}

function collapseEverything() {
  if (root.children) {
    root._children = root.children;
    root._children.forEach(collapse);
    root.children = null;
  }
  update(root);
}

d3.select("#collapse-all").on("click", collapseEverything);
d3.select("#reset-view").on("click", () => { resetTree(); update(root); });
update(root);
